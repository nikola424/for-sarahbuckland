<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>You're booked in · Sarah Buckland</title>
  <meta name="robots" content="noindex" />
  <script>document.documentElement.className += " js";</script>
  <link rel="icon" href="../assets/img/favicon.png" type="image/png" />
  <link rel="apple-touch-icon" href="../assets/img/apple-touch-icon.png" />
  <link rel="stylesheet" href="../assets/vendor/lenis.css" />
  <link rel="stylesheet" href="../vsl/vsl.css" />
  <link rel="stylesheet" href="../vsl/brand.css" />
<link rel="stylesheet" href="../assets/fonts-lp.css?v=3" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800;900&family=Inter:wght@400;500;700&family=Noto+Serif:ital,wght@1,400;1,500&display=swap">
<style>
:root{--bg:#0a0a0a;--surface:#141210;--ink:#f8f5f0;--muted:#cfc6b8;--hair:rgba(248,245,240,.14);--hair-soft:rgba(248,245,240,.07);--accent:#b9a68b;--accent-text:#d9c9ac;--accent-ink:#0a0a0a;--accent-soft:rgba(185,166,139,.16);--sans:"Inter",Arial,sans-serif;--display:"Archivo",Arial,sans-serif}
html{overflow-y:scroll}
body{background:#0a0a0a;color:#f8f5f0;font-family:"Inter",Arial,sans-serif}
.hero__title,.ty-step__title{font-family:"Archivo",Arial,sans-serif;color:#f8f5f0}
.hero__eyebrow,.ty-step__label{color:#d9c9ac}
.ty__signoff{font-family:"Noto Serif",Georgia,serif;font-style:italic;color:#d9c9ac}
</style>
</head>
<body>
  <main class="page">
    <section class="hero" style="padding-bottom:0">
      <p class="eyebrow hero__eyebrow">You're booked in</p>
      <h1 class="hero__title">Here's how to get the most out of your call</h1>
    </section>

    <div class="container">
      <!-- Step 1 · welcome video (video X: one unique frame) -->
      <section class="ty-step">
        <p class="ty-step__label reveal">Step 1 of 3</p>
        <h2 class="ty-step__title reveal" style="--i:1">Watch the video below</h2>
        
        <figure class="ccard ccard--hero reveal reveal--pop" style="--i:2">
          <span class="ccard__thumb"><img src="../assets/img/thankyou/welcome.jpg" alt="Welcome video from Sarah" /><span class="ccard__play" aria-hidden="true"></span></span>
        </figure>
      </section>

      <!-- Step 2 · breakouts (video Y: frames from one sitting) -->
      <section class="ty-step">
        <p class="ty-step__label reveal">Step 2 of 3</p>
        <h2 class="ty-step__title reveal" style="--i:1">Get your questions answered</h2>
        <div class="grid2">
          <figure class="ccard reveal reveal--pop" style="--i:0">
            <span class="ccard__thumb"><img src="../assets/img/thankyou/q1.jpg" alt="" loading="lazy" /><span class="ccard__play" aria-hidden="true"></span></span>
            <figcaption class="ccard__cap" style="padding-top:16px">Is the call just going to be a sales pitch?</figcaption>
          </figure>
          <figure class="ccard reveal reveal--pop" style="--i:1">
            <span class="ccard__thumb"><img src="../assets/img/thankyou/q2.jpg" alt="" loading="lazy" /><span class="ccard__play" aria-hidden="true"></span></span>
            <figcaption class="ccard__cap" style="padding-top:16px">Does this work for my kind of business?</figcaption>
          </figure>
          <figure class="ccard reveal reveal--pop" style="--i:2">
            <span class="ccard__thumb"><img src="../assets/img/thankyou/q3.jpg" alt="" loading="lazy" /><span class="ccard__play" aria-hidden="true"></span></span>
            <figcaption class="ccard__cap" style="padding-top:16px">How much time will this take each week?</figcaption>
          </figure>
          <figure class="ccard reveal reveal--pop" style="--i:3">
            <span class="ccard__thumb"><img src="../assets/img/thankyou/q4.jpg" alt="" loading="lazy" /><span class="ccard__play" aria-hidden="true"></span></span>
            <figcaption class="ccard__cap" style="padding-top:16px">What if my audience is still small?</figcaption>
          </figure>
        </div>
      </section>

      <!-- Step 3 · due diligence (video Z: frames from one other sitting) -->
      <section class="ty-step">
        <p class="ty-step__label reveal">Step 3 of 3</p>
        <h2 class="ty-step__title reveal" style="--i:1">Overcome your suspicions</h2>
        <div class="grid2">
          <figure class="ccard reveal reveal--pop" style="--i:0">
            <span class="ccard__thumb"><img src="../assets/img/thankyou/s1.jpg" alt="" loading="lazy" /><span class="ccard__play" aria-hidden="true"></span></span>
            <figcaption class="ccard__cap" style="padding-top:16px">Does Sarah still sell, or just teach it?</figcaption>
          </figure>
          <figure class="ccard reveal reveal--pop" style="--i:1">
            <span class="ccard__thumb"><img src="../assets/img/thankyou/s2.jpg" alt="" loading="lazy" /><span class="ccard__play" aria-hidden="true"></span></span>
            <figcaption class="ccard__cap" style="padding-top:16px">What results have other women had?</figcaption>
          </figure>
          <figure class="ccard reveal reveal--pop" style="--i:2">
            <span class="ccard__thumb"><img src="../assets/img/thankyou/s3.jpg" alt="" loading="lazy" /><span class="ccard__play" aria-hidden="true"></span></span>
            <figcaption class="ccard__cap" style="padding-top:16px">What if I&rsquo;ve tried a programme before and it didn&rsquo;t work?</figcaption>
          </figure>
          <figure class="ccard reveal reveal--pop" style="--i:3">
            <span class="ccard__thumb"><img src="../assets/img/thankyou/s4.jpg" alt="" loading="lazy" /><span class="ccard__play" aria-hidden="true"></span></span>
            <figcaption class="ccard__cap" style="padding-top:16px">Why not just learn it from the free content?</figcaption>
          </figure>
        </div>
      </section>

      <p class="ty__signoff reveal">See you on the call.</p>
    </div>
  </main>

  <footer class="brandfoot">
    <div class="brand">
      <img src="../assets/img/lp/signature.png" alt="Sarah" style="width:150px;display:block" />
    </div>
  </footer>

  <script src="../assets/vendor/lenis.min.js"></script>
  <script src="../vsl/vsl.js"></script>
</body>
</html>
